<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O presente da diretora</title>
<link rel="icon" href="icone.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="v" src="video.mp4" autoplay playsinline preload="auto"></video>
<script>
// Só o vídeo, sem nada na frente: toca do começo ao fim, sem pausas, e para no último quadro.
// Os navegadores só deixam tocar com som depois de um clique ou tecla; se o autoplay
// for bloqueado, o primeiro clique, toque ou tecla começa o vídeo (e entra em tela cheia).
const v = document.getElementById('v');
v.controls = false;

function tela_cheia() {
  const el = document.documentElement;
  if (document.fullscreenElement) return;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch?.(() => {}); } catch (e) {}
}

function comecar() {
  tela_cheia();
  if (v.paused && !v.ended) v.play().catch(() => {});
}

v.play().catch(() => {});   // tenta tocar sozinho (com som); se não der, espera um clique/tecla
document.addEventListener('click', comecar);
document.addEventListener('touchend', comecar);
document.addEventListener('keydown', comecar);
v.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
