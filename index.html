<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O presente da diretora</title>
<link rel="icon" href="icone.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="v" src="video.mp4#t=0.001" playsinline preload="auto"></video>
<script>
// Só o vídeo, sem nada na frente. Ao abrir, fica parado no primeiro quadro.
// O vídeo só começa quando aperta ESPAÇO; depois toca até o fim sem pausas
// (outros espaços, cliques e teclas não fazem nada) e para no último quadro.
const v = document.getElementById('v');
v.controls = false;
v.autoplay = false;
let comecou = false;

function tela_cheia() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (r && r.catch) r.catch(() => {});
  } catch (e) {}
}

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  e.preventDefault();
  if (comecou) return;
  comecou = true;
  tela_cheia();
  v.play().catch(() => { comecou = false; });
});
v.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
